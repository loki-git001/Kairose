{% for supporter in supporters %}
<tr style="cursor: pointer;" onclick="window.location.href='{% url 'people:supporter_detail' supporter.id %}'">
    <td>{{ supporter.created_at|date:"Y-m-d" }}</td>
    <td><strong>{{ supporter.first_name }} {{ supporter.last_name }}</strong></td>
    <td>{{ supporter.phone_number|default:"-" }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="3" class="text-center py-5 text-muted">
        <i class="bi bi-people fs-1 d-block mb-3"></i>
        You have not created any supporters yet (or no matches found).
    </td>
</tr>
{% endfor %}
